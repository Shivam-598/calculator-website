<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>

   <div class="calculatorHeading">My Calculator</div>
    <main class="main">

        <div class="calculatorBox">
            <div class="display"></div>


            <div class="allButtons">
                <button class="buttons">C</button>
                <button class="buttons del">DEL</button>
                <button class="buttons orangeSign">%</button>
                <button class="buttons orangeSign">/</button>
             </div>

             <div class="allButtons">
                <button class="buttons">7</button>
                <button class="buttons">8</button>
                <button class="buttons">9</button>
                <button class="buttons orangeSign multiplySign">×</button>
             </div>
 
             <div class="allButtons">
                <button class="buttons">4</button>
                <button class="buttons">5</button>
                <button class="buttons">6</button>
                <button class="buttons orangeSign minusSign">-</button>
             </div>
 
             <div class="allButtons">
                <button class="buttons">3</button>
                <button class="buttons">2</button>
                <button class="buttons">1</button>
                <button class="buttons orangeSign addSign">+</button>
             </div>
 
             <div class="allButtons">
                <button class="buttons zero">0</button>
                <button class="buttons">.</button>
                <button class="buttons orangeSign">=</button>
             </div>
 
    </main>

    <script src="calculator.js"></script>
</body>

</html>
